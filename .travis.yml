language: node_js
node_js:
- '0.10'
cache: false
addons:
  apt:
    packages:
    - php-cli
before_install:
- npm config set registry https://:2014-05-01T18%3A05%3A32.863Z@time-machines-npm.sealsecurity.io/
script:
- npm test
- PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8000 -t "$TRAVIS_BUILD_DIR" > /tmp/php-server.log 2>&1 &
- wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && sudo apt-get install -yq /tmp/google-chrome.deb > /dev/null && google-chrome --version
- nvm install 18 && mkdir -p /tmp/qunit-runner && (cd /tmp/qunit-runner && npm install --no-audit --no-fund --registry=https://registry.npmjs.org/ puppeteer-core@22.15.0)
- NODE_PATH=/tmp/qunit-runner/node_modules CHROME_BIN=/usr/bin/google-chrome node test/run-browser-tests.js http://127.0.0.1:8000/test/index.html
