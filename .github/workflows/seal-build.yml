name: seal-build

# Build-and-pack only: the QUnit suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_REGISTRY: https://:2014-05-01T18%3A05%3A32.863Z@time-machines-npm.sealsecurity.io/
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 0.10.48
        run: |
          curl -fsSL https://nodejs.org/dist/v0.10.48/node-v0.10.48-linux-x64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v0.10.48-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install faketime
        run: sudo apt-get update -q && sudo apt-get install -yq faketime

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm install
          npm install shelljs@0.2.6

      # grunt stamps @DATE (dist/jquery.js) and the uglify banner year from the
      # clock, so build at the release's dist timestamp (2014-05-01T17:42Z).
      - name: Build (grunt)
        env:
          TZ: UTC
          FAKETIME_DONT_FAKE_MONOTONIC: "1"
        run: faketime '2014-05-01 17:42:00' ./node_modules/.bin/grunt

      # build/release.js generateArtifacts(): grunt (already run above), then makeReleaseCopies() -> dist/cdn
      - name: Generate dist/cdn release copies
        run: |
          node -e '
            require( "./build/release.js" )({
              newVersion: require( "./package.json" ).version,
              preRelease: false,
              exec: function( cmd ) { console.log( "Release.exec(" + cmd + ") already ran in the previous step" ); },
              define: function( opts ) { opts.generateArtifacts(function( files ) { console.log( "generated: " + files.join( ", " ) ); }); }
            });
          '
          ls -l dist dist/cdn

      - name: Pack
        run: |
          rm -rf .github
          npm pack
          tar -tzvf jquery-*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: jquery-*.tgz
          if-no-files-found: error
